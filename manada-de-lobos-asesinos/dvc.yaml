stages:
  preprocess:
    foreach:
      - EURUSD
      - GBPUSD
      - AUDUSD
      - USDCHF
      - USDJPY
      - EURJPY
      - EURGBP
      - USDCAD
      - XAUUSD
    do:
      cmd: python src/data/preprocess.py --symbol ${item} --source mt5
      deps:
        - data/raw/mt5_${item}_M5.csv
        - data/raw/fred_DXY.csv
        - data/raw/fred_VIX.csv
        - data/raw/fred_US10Y.csv
        - data/raw/fred_FED.csv
        - src/data/preprocess.py
      outs:
        - data/processed/mt5_${item}_M5.csv

  walkforward:
    foreach:
      - EURUSD
      - GBPUSD
      - AUDUSD
      - USDCHF
      - USDJPY
      - EURJPY
      - EURGBP
      - USDCAD
      - XAUUSD
    do:
      cmd: >
        python src/walkforward.py
        --processed-file data/processed/mt5_${item}_M5.csv
        --out-metrics reports/walkforward_metrics_${item}.json
        --out-folds reports/walkforward_folds_${item}.csv
        --date-col date
        --target-col target
        --min-train-size 500
        --test-size 200
        --step-size 200
      deps:
        - data/processed/mt5_${item}_M5.csv
        - src/walkforward.py
      outs:
        - reports/walkforward_folds_${item}.csv
      metrics:
        - reports/walkforward_metrics_${item}.json:
            cache: false

  train:
    foreach:
      - EURUSD
      - GBPUSD
      - AUDUSD
      - USDCHF
      - USDJPY
      - EURJPY
      - EURGBP
      - USDCAD
      - XAUUSD
    do:
      cmd: >
        python src/train.py
        --processed data/processed/mt5_${item}_M5.csv
        --out-model models/model_${item}.pkl
        --out-metrics reports/train_metrics_${item}.json
      deps:
        - data/processed/mt5_${item}_M5.csv
        - src/train.py
      outs:
        - models/model_${item}.pkl
      metrics:
        - reports/train_metrics_${item}.json:
            cache: false